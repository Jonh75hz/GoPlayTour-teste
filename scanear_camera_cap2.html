<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capítulo 2 | Scan</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader { opacity: 0; } 
    </style>
  </head>

  <body>
    <a-scene
      id="ar-scene"
      vr-mode-ui="enabled: false"
      raycaster="objects: *; far: 100; near: 0; showLine: false;" 
      arjs="sourceType: webcam; 
            detectionMode: mono; 
            debugUIEnabled: false; 
            sourceWidth: 640; 
            sourceHeight: 480; 
            displayWidth: 640; 
            displayHeight: 480;" 
      renderer="logarithmicDepthBuffer: true; alpha: true;">
      
      <a-assets>
          <img id="img-estacao" src="fotos/desafio_estação.png" alt="Estação Ferroviária">
      </a-assets>
      
      <a-marker id="estacao-marker" preset="hiro">
        <a-sphere id="ponto-estacao"
                  radius="0.5"
                  src="#img-estacao"
                  position="0 1.5 0"
                  class="clickable"
                  segments-width="120"
                  segments-height="120"
                  material="shader: flat;"> 
            <a-text value="ESTAÇÃO: CLIQUE!"
                    align="center"
                    position="0 0.8 0"
                    scale="1.2 1.2 1.2"
                    color="white"></a-text>
        </a-sphere>
      </a-marker>

      <a-entity 
        camera 
        cursor="fuse: false; rayOrigin: cursor; objects: .clickable;"
      ></a-entity> 
      
    </a-scene>

    <div id="descricao-overlay" style="display: none;"></div>

    <script type="module">
    import { auth } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
    import { saveProgressToFirebase } from './progress-manager.js';

    const pontoEstacao = document.querySelector('#ponto-estacao');
    const DESTINATION_URL = 'desafio_estacao.html';
    const CHALLENGE_ID = 'estacao';

    function unlockLocal() {
      try { localStorage.setItem(`unlocked_${CHALLENGE_ID}`, 'true'); } catch (e) { console.warn(e); }
    }

    async function unlockForUserAndRedirect() {
      try {
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              await saveProgressToFirebase(CHALLENGE_ID, 100, true);
              unlockLocal();
              sessionStorage.setItem(`show_unlock_${CHALLENGE_ID}`, 'true');
              window.location.href = DESTINATION_URL;
            } catch (err) {
              console.warn('Erro ao salvar no banco, usando localStorage', err);
              unlockLocal();
              sessionStorage.setItem(`show_unlock_${CHALLENGE_ID}`, 'true');
              window.location.href = DESTINATION_URL;
            }
          } else {
            unlockLocal();
            sessionStorage.setItem(`show_unlock_${CHALLENGE_ID}`, 'true');
            window.location.href = DESTINATION_URL;
          }
        });
      } catch (e) {
        console.warn('Falha ao usar Firebase, fallback local', e);
        unlockLocal();
        sessionStorage.setItem(`show_unlock_${CHALLENGE_ID}`, 'true');
        window.location.href = DESTINATION_URL;
      }
    }

    pontoEstacao.addEventListener('click', function () {
      console.log(`Tentando desbloquear desafio ${CHALLENGE_ID}...`);
      unlockForUserAndRedirect();
    });

    const estacaoMarker = document.querySelector('#estacao-marker');
    estacaoMarker.addEventListener('markerFound', () => {
      console.log('marker encontrado');
    });
    estacaoMarker.addEventListener('markerLost', () => {
      console.log('marker perdido');
    });

    </script>
  </body>
</html>
