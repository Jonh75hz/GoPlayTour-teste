<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | O Mistério de Iracema</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <label for="fileInput" class="profile-pic-label">
                <div class="profile-pic-placeholder" id="profilePicPlaceholder">
                    <span class="plus-icon">+</span>
                    <span>Adicionar Foto</span>
                </div>
                <img src="" alt="Foto de Perfil" class="profile-pic" id="profilePic" style="display: none;">
            </label>
            <input type="file" id="fileInput" hidden accept="image/*">
            <h2 id="userName">Nome do Usuário</h2>
            <div class="points-section">
                <p>Total de Pontos</p>
                <span class="points-display" id="userPoints">120</span><span class="star">&#9733;</span>
            </div>
        </div>
        <div class="progress-section">
            <div class="progress-circle" data-progress="0">
                <div class="progress-circle-inner">
                    <span id="progressPercentage">0%</span>
                </div>
            </div>
            <p>Progresso Total</p>
        </div>
        <div class="achievements-section">
            <h3>Conquistas</h3>
            <div class="achievements-grid">
                <div class="achievement-card">
                    <span class="achievement-icon">&#127941;</span>
                    <p>Explorador Nível 1</p>
                </div>
                <div class="achievement-card">
                    <span class="achievement-icon">&#127941;</span>
                    <p>Mestre da Investigação</p>
                </div>
                <div class="achievement-card">
                    <span class="achievement-icon">&#127941;</span>
                    <p>Andarilho Nível 1</p>
                </div>
                <div class="achievement-card">
                    <span class="achievement-icon">&#127941;</span>
                    <p>Coletor de Pistas</p>
                </div>
            </div>
        </div>
        <div class="button-container">
            <a href="index.html" class="back-button">Voltar</a>
            <button id="logout-button" class="logout-button">Logout</button>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="perfil.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
