<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios na Casa de Cultura</title>
    <link rel="stylesheet" href="desafio_casa_cultura.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <a href="index.html" class="back-button"><i class="fas fa-arrow-left"></i> Voltar</a>

        <h1 class="title">Desafios na Casa de Cultura</h1>

        <div class="location-image-container">
            <img src="fotos/casa de cultura4.1.jpg" alt="Casa de Cultura de Ipu">
        </div>
        <p class="subtitle">O centro da arte e história de Ipu</p>

        <div class="missions-card">
            <h2>Missões</h2>
            <div class="mission">
                <h3>Resolva a Charada</h3>
                <p class="riddle-text">O que é que todo mundo vem ver, mas não dá pra beber?</p>
                <div class="answer-input-container">
                    <input type="text" placeholder="Escreva sua resposta">
                    <button class="send-button"><i class="fas fa-paper-plane"></i></button>
                </div>
                <button class="hint-button"><i class="fas fa-question-circle"></i> Mostrar Dica</button>

                <div class="progress-container">
                    <div class="progress-bar-background">
                        <div class="progress-bar" style="width: 0%;"></div>
                    </div>
                    <span>0%</span>
                </div>
            </div>
        </div>

        <div class="prize-card">
            <p>Complete as missões para receber seu prêmio</p>
        </div>
    </div>

    <!-- Overlay mostrado quando o desafio estiver bloqueado -->
    <div id="lockedOverlay" class="locked-overlay" style="display:none;">
        <div class="locked-inner">
            <i class="fas fa-lock fa-3x"></i>
            <h2>Desafio Bloqueado</h2>
            <p>Use o scanner para desbloquear este desafio.</p>
            <a href="capitulo_3.1.html" class="button-continue">Abrir Scanner</a>
        </div>
    </div>

    <script type="module">
    import { auth, database } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
    import { ref, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    const overlay = document.getElementById('lockedOverlay');

    function showLocked() {
      overlay.style.display = 'flex';
      // Desabilitar interações principais
      document.querySelectorAll('.missions-card input, .missions-card button').forEach(el => el.disabled = true);
    }

    function hideLocked() {
      overlay.style.display = 'none';
    }

    // Checa primeiro localStorage, depois Firebase (se autenticado)
    async function checkUnlocked() {
      try {
        const local = localStorage.getItem('unlocked_casa_cultura');
        if (local === 'true') { hideLocked(); return; }

        // se houver firebase, verifica se o usuário está autenticado e tem o desbloqueio
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              const snap = await get(ref(database, `users/${user.uid}/unlocked/casa_cultura`));
              if (snap && snap.exists && snap.val() === true) {
                localStorage.setItem('unlocked_casa_cultura','true');
                hideLocked();
              } else {
                showLocked();
              }
            } catch (err) {
              console.warn('Erro ao verificar banco, mostrando bloqueado por segurança', err);
              showLocked();
            }
          } else {
            // usuário não autenticado e sem localStorage: bloqueado
            showLocked();
          }
        });
      } catch (e) {
        console.warn('Erro ao checar desbloqueio, fallback: bloquear', e);
        showLocked();
      }
    }

    document.addEventListener('DOMContentLoaded', checkUnlocked);
    </script>
</body>
</html>
