<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 2: Rastros na Estação</title>
    <!-- Usando o CSS unificado do capítulo 1 -->
    <link rel="stylesheet" href="capitulo_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main class="main-container">
        <button class="btn-voltar" onclick="window.location.href='capitulos.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <div class="content-wrapper">
            <header class="chapter-header">
                <!-- Imagem específica do Capítulo 2 -->
                <img src="fotos/Estação.jpg" alt="Estação de Ipu">
                <div class="header-overlay">
                    <h1>Capítulo 2: Rastros na Estação</h1>
                </div>
            </header>

            <section class="chapter-body">
                <div class="star-rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="far fa-star"></i>
                    <i class="far fa-star"></i>
                </div>

                <div class="text-slider">
                    <p class="chapter-text" id="text-content"></p>
                </div>

                <div class="pagination-container">
                    <button class="arrow-btn prev" id="prev-btn" onclick="prevScreen()" disabled>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="page-indicator" id="page-indicator"></div>
                    <button class="arrow-btn next" id="next-btn" onclick="nextScreen()">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="clues-section">
                    <h2>Pistas Encontradas <i class="fas fa-search"></i></h2>
                    <div class="clues-gallery">
                        <figure>
                            <img src="fotos/chave.jpg" alt="Chaves">
                            <figcaption>Chaves</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/cartas.jpg" alt="Escritura">
                            <figcaption>Escritura</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/carta.jpg" alt="Carta">
                            <figcaption>Carta</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>

        <button class="btn-progredir" onclick="window.location.href='capitulo_2.1.html'">
            Progredir Enredo
        </button>
    </main>

    <script>
        const screens = [
            `A Estação aparece como um estranho anacronismo. Colunas simples, de inspiração greco-romana, sustentam a fachada — A combinação de linhas retas e arcos dá a impressão de que o prédio foi desenhado para durar mais que qualquer governo.`,
            `O prédio chama atenção de longe: amarelo forte, detalhes brancos, tudo alinhado como se tivesse sido desenhado com régua. Três arcos se apoiam em colunas grossas bem na entrada.\nParece sério. Parece importante.`,
            `Todo mundo na cidade sabe: aqui funciona a biblioteca pública da cidade.\nTalvez esteja aberta hoje. Talvez não.\nDepende do dia, depende da história — essa estação vive mudando de função.`,
            `Da rua, dá pra ver as portas grandes, cinza escuro.\nParadas. Silenciosas.\nVocê tem a sensação de que, se alguém empurrar, pode aparecer uma pessoa do passado dizendo que desceu do trem errado.`,
            `Abaixo das fotos, há um envelope fino, preso com um clipe enferrujado. Dentro, um recorte de jornal:\n\n“Testemunhas afirmam que a remoção foi planejada. Autoridades negam.”\nE, no verso do papel, alguém escreveu à mão, com pressa:\n“Procure quem trabalha com madeira. Ele viu.`,
            `Com o envelope na mão, você percebe um pequeno adesivo colado discretamente no canto inferior do painel. O mesmo símbolo que encontrou na Praça. Pequeno demais para ser publicidade. Intencional demais para ser acaso.\n\nEle parece apontar uma direção: o bairro industrial, mais abaixo, onde fica a oficina.`
        ];

        let current = 0;
        const total = screens.length;
        const contentEl = document.getElementById('text-content');
        const indicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderScreen(index) {
            contentEl.textContent = screens[index];
            indicatorEl.textContent = `${index + 1} / ${total}`;
        }

        function nextScreen() {
            if (current < total - 1) { current += 1; renderScreen(current); }
            updateButtons();
        }

        function prevScreen() {
            if (current > 0) { current -= 1; renderScreen(current); }
            updateButtons();
        }

        function updateButtons() {
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        renderScreen(current);
        updateButtons();
    </script>
</body>
</html>
