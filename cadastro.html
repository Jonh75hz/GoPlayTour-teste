<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | O Mistério de Iracema</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="register-container">
        <h2>Registrar</h2>
        <div id="message" style="color: green; margin-bottom: 10px;"></div>
        <input type="text" id="registerName" placeholder="Nome">
        <input type="email" id="registerEmail" placeholder="Email">
        <input type="password" id="registerPassword" placeholder="Password">
        <button id="registerBtn">Registrar</button>
        <p>Já tem uma conta? <a href="login.html">Login</a></p>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cadastro.js"></script>
</body>
</html>
