<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio | Estação</title>
    <link rel="stylesheet" href="desafio_estacao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main class="main-container">
        <button class="btn-voltar" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <h1 class="main-title">Desafios na Estação</h1>

        <div class="image-banner">
            <img src="fotos/desafio_estação.png" alt="Estação">
            <p>A Estação Ferroviária,um lugar onde eventos misteriosos acontecem</p>
        </div>

        <section class="missions-card">
            <h2>Missões</h2>
            <div class="riddle-section">
                <h3>Resolva a Charada</h3>
                <p>O que é que todo mundo vem ver, mas não dá pra beber?</p>
                <div class="response-area">
                    <input type="text" placeholder="Escreva sua resposta">
                    <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
                <button class="tip-btn">
                    <i class="fas fa-question-circle"></i> Mostrar Dica
                </button>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" style="width: 0%;"></div>
                <span>0%</span>
            </div>
        </section>

        <section class="prize-card">
            <p>Complete as missões para receber seu prêmio</p>
        </section>
    </main>

    <!-- Overlay mostrado quando o desafio estiver bloqueado -->
    <div id="lockedOverlay" class="locked-overlay" style="display:none;">
        <div class="locked-inner">
            <i class="fas fa-lock fa-3x"></i>
            <h2>Desafio Bloqueado</h2>
            <p>Use o scanner para desbloquear este desafio.</p>
            <a href="capitulo_2.1.html" class="button-continue">Abrir Scanner</a>
        </div>
    </div>

    <script type="module">
    import { auth, database } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
    import { ref, get } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

    const overlay = document.getElementById('lockedOverlay');

    function showLocked() {
      overlay.style.display = 'flex';
      // Desabilitar interações principais
      document.querySelectorAll('.missions-card input, .missions-card button').forEach(el => el.disabled = true);
    }

    function hideLocked() {
      overlay.style.display = 'none';
    }

    // Checa primeiro localStorage, depois Firebase (se autenticado)
    async function checkUnlocked() {
      try {
        const local = localStorage.getItem('unlocked_estacao');
        if (local === 'true') { hideLocked(); return; }

        // se houver firebase, verifica se o usuário está autenticado e tem o desbloqueio
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              const snap = await get(ref(database, `users/${user.uid}/unlocked/estacao`));
              if (snap && snap.exists && snap.val() === true) {
                localStorage.setItem('unlocked_estacao','true');
                hideLocked();
              } else {
                showLocked();
              }
            } catch (err) {
              console.warn('Erro ao verificar banco, mostrando bloqueado por segurança', err);
              showLocked();
            }
          } else {
            // usuário não autenticado e sem localStorage: bloqueado
            showLocked();
          }
        });
      } catch (e) {
        console.warn('Erro ao checar desbloqueio, fallback: bloquear', e);
        showLocked();
      }
    }

    document.addEventListener('DOMContentLoaded', checkUnlocked);
    </script>
    <script src="desafio_bica_ipu.js"></script>
</body>
</html>
