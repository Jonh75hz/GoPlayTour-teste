<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 3 | A Lenda Escondida</title>
    <!-- Usando o CSS unificado do capítulo 1 -->
    <link rel="stylesheet" href="capitulo_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="auth-manager.js"></script>
</head>
<body>
    <main class="main-container">
        <button class="btn-voltar" onclick="window.location.href='capitulos.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <div class="content-wrapper">
            <header class="chapter-header">
                <!-- Imagem específica do Capítulo 3 -->
                <img src="fotos/cultura.jpg" alt="Casa de Cultura">
                <div class="header-overlay">
                    <h1>Capítulo 3: A Lenda Escondida</h1>
                </div>
            </header>

            <section class="chapter-body">
                <div class="star-rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="far fa-star"></i>
                    <i class="far fa-star"></i>
                </div>

                <div class="text-slider">
                    <p class="chapter-text" id="text-content"></p>
                </div>

                <div class="pagination-container">
                    <button class="arrow-btn prev" id="prev-btn" onclick="prevScreen()" disabled>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="page-indicator" id="page-indicator"></div>
                    <button class="arrow-btn next" id="next-btn" onclick="nextScreen()">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="clues-section">
                    <h2>Pistas Encontradas <i class="fas fa-search"></i></h2>
                    <div class="clues-gallery">
                        <figure>
                            <img src="fotos/chave.jpg" alt="Chaves">
                            <figcaption>Chaves</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/carta.jpg" alt="Escritura">
                            <figcaption>Escritura</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/cartas.jpg" alt="Carta">
                            <figcaption>Carta</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>
         <button class="btn-progredir" onclick="window.location.href='capitulo_3.1.html'">
                Progredir Enredo
            </button>
    </main>
    <script>
        const screens = [
            `A Casa de Cultura, um sobrado antigo no centro da cidade, parece parada no tempo. As janelas altas e a sacada de ferro são um convite para histórias que poucos lembram.`,
            `Dentro, o cheiro de madeira antiga e papel domina o ar. Um painel exibe fotos em preto e branco da construção da cidade. Em uma delas, um rosto familiar se destaca na multidão, perto da antiga estátua de Iracema.`,
            `É o mesmo marceneiro que você encontrou na praça. Na foto, ele é jovem, e ao seu lado está um homem com um conjunto de plantas de construção.`,
            `Você se aproxima da bibliotecária, uma senhora de olhar atento. Ao perguntar sobre a demolição da estátua original, ela hesita. 'Registros dessa época são... complicados', ela diz, 'Muitas páginas foram arrancadas dos livros.'`,
            `Ela então lhe entrega uma ficha de biblioteca antiga. No verso, uma anotação a lápis: 'A chave para a verdade não está no que foi construído, mas no que foi enterrado. Procure a planta original na igrejinha.' O mesmo símbolo dos outros locais está desenhado ao lado da anotação.`
        ];

        let current = 0;
        const total = screens.length;
        const contentEl = document.getElementById('text-content');
        const indicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderScreen(index) {
            contentEl.textContent = screens[index];
            indicatorEl.textContent = `${index + 1} / ${total}`;
        }

        function nextScreen() {
            if (current < total - 1) { current += 1; renderScreen(current); }
            updateButtons();
        }

        function prevScreen() {
            if (current > 0) { current -= 1; renderScreen(current); }
            updateButtons();
        }

        function updateButtons() {
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        renderScreen(current);
        updateButtons();
    </script>
</body>
</html>
