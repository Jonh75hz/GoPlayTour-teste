<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 4: Vozes da Igrejinha</title>
    <!-- Usando o CSS unificado do capítulo 1 -->
    <link rel="stylesheet" href="capitulo_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main class="main-container">
        <button class="btn-voltar" onclick="window.location.href='capitulos.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <div class="content-wrapper">
            <header class="chapter-header">
                <!-- Imagem específica do Capítulo 4 -->
                <img src="fotos/igrejinha.jpg" alt="Igrejinha do Céu">
                <div class="header-overlay">
                    <h1>Capítulo 4: Vozes da Igrejinha</h1>
                </div>
            </header>

            <section class="chapter-body">
                <div class="star-rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="far fa-star"></i>
                </div>

                <div class="text-slider">
                    <p class="chapter-text" id="text-content"></p>
                </div>

                <div class="pagination-container">
                    <button class="arrow-btn prev" id="prev-btn" onclick="prevScreen()" disabled>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="page-indicator" id="page-indicator"></div>
                    <button class="arrow-btn next" id="next-btn" onclick="nextScreen()">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="clues-section">
                    <h2>Pistas Encontradas <i class="fas fa-search"></i></h2>
                    <div class="clues-gallery">
                        <figure>
                            <img src="fotos/chave.jpg" alt="Chaves">
                            <figcaption>Chaves</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/cartas.jpg" alt="Escritura">
                            <figcaption>Escritura</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/carta.jpg" alt="Carta">
                            <figcaption>Carta</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>

        <button class="btn-progredir" onclick="window.location.href='capitulo_4.1.html'">
            Progredir Enredo
        </button>
    </main>

    <script>
        const screens = [
            `A Igrejinha do Céu, no ponto mais alto da cidade, é simples e branca, com uma aura de paz. De lá, a vista de Ipu é completa.`,
            `Dentro, o sacristão, um homem idoso, cuida do local. Você pergunta sobre a planta original da praça.`,
            `Ele suspira. 'Muitos segredos esta cidade guarda. A planta que você procura foi considerada... perigosa. Mostrava algo que deveria ficar escondido.'`,
            `'O arquiteto que a desenhou era um visionário, mas suas ideias entravam em conflito com os interesses dos poderosos da época', ele continua, limpando um candelabro.`,
            `'Ele escondeu uma cópia na base da Bica do Ipu, o nosso maior tesouro. Ele dizia que a água da bica lavaria as mentiras e revelaria a verdade. Procure pela marca d'água, o mesmo símbolo que tem te guiado.'`
        ];

        let current = 0;
        const total = screens.length;
        const contentEl = document.getElementById('text-content');
        const indicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderScreen(index) {
            contentEl.textContent = screens[index];
            indicatorEl.textContent = `${index + 1} / ${total}`;
        }

        function nextScreen() {
            if (current < total - 1) { current += 1; renderScreen(current); }
            updateButtons();
        }

        function prevScreen() {
            if (current > 0) { current -= 1; renderScreen(current); }
            updateButtons();
        }

        function updateButtons() {
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        renderScreen(current);
        updateButtons();
    </script>
</body>
</html>
