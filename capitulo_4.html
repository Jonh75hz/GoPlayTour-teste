<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 4: Vozes da Igrejinha </title>
    <link rel="stylesheet" href="capitulo_4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <a href="capitulos.html" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar</a>

    <main class="capitulo-container">
        <header class="capitulo-header">
            <h1>Capítulo 4: Vozes da Igrejinha </h1>
        </header>

        <div class="capitulo-body">
            <div class="stars">
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
                <i class="far fa-star"></i>
                <i class="far fa-star"></i>
            </div>
            <!-- Slider de texto com navegação Prev/Next -->
            <div class="text-slider">
                <p class="chapter-text" id="text-content">Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde magnam eaque voluptatem tempora quis saepe modi natus repudiandae.</p>
            </div>

            <div class="pagination-container">
                <button class="arrow-btn prev" id="prev-btn" onclick="prevScreen()" disabled>
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="page-indicator" id="page-indicator">1 / 5</div>
                <button class="arrow-btn next" id="next-btn" onclick="nextScreen()">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <section class="pistas-encontradas">
                <h2>Pistas Encontradas <i class="fas fa-search"></i></h2>
                <div class="pistas-grid">
                    <div class="pista-card">
                        <img src="/fotos/chave.jpg" alt="Pista - Chaves">
                        <p>Chaves</p>
                    </div>
                    <div class="pista-card">
                        <img src="/fotos/cartas.jpg" alt="Pista - Escritura">
                        <p>Escritura</p>
                    </div>
                    <div class="pista-card">
                        <img src="/fotos/carta.jpg" alt="Pista - Carta">
                        <p>Carta</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="progredir-container">
        <button class="btn-progredir" onclick="window.location.href='capitulo_4.1.html'">Progredir Enredo</button>
    </div>
    <script>
        const screens = [
            'Lorem ipsum dolor sit amet consectetur adipisicing elit.',
            'Unde magnam eaque voluptatem tempora quis saepe modi natus.',
            'Repudiandae vitae! At, sapiente quae. Animi incidunt inventore.',
            'Nihil quas? Magni, ipsa velit? Quo voluptas doloribus beatae.',
            'Voluptate aspernatur perspiciatis rerum hic optio omnis quia.'
        ];

        let current = 0;
        const total = screens.length;
        const contentEl = document.getElementById('text-content');
        const indicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderScreen(index) {
            contentEl.textContent = screens[index];
            indicatorEl.textContent = `${index + 1} / ${total}`;
        }

        function nextScreen() {
            if (current < total - 1) {
                current += 1;
                renderScreen(current);
            }
            updateButtons();
        }

        function prevScreen() {
            if (current > 0) {
                current -= 1;
                renderScreen(current);
            }
            updateButtons();
        }

        function updateButtons() {
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        renderScreen(current);
        updateButtons();
    </script>
</body>
</html>
