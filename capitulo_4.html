<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Capítulo 4: Vozes da Igrejinha</title>\n    <!-- Usando o CSS unificado do capítulo 1 -->\n    <link rel=\"stylesheet\" href=\"capitulo_1.css\">\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\">\n</head>\n<body>\n    <main class=\"main-container\">\n        <button class=\"btn-voltar\" onclick=\"window.location.href=\'capitulos.html\'\">\n            <i class=\"fas fa-arrow-left\"></i> Voltar\n        </button>\n\n        <div class=\"content-wrapper\">\n            <header class=\"chapter-header\">\n                <!-- Imagem específica do Capítulo 4 -->\n                <img src=\"fotos/igrejinha.jpg\" alt=\"Igrejinha do Céu\">\n                <div class=\"header-overlay\">\n                    <h1>Capítulo 4: Vozes da Igrejinha</h1>\n                </div>\n            </header>\n\n            <section class=\"chapter-body\">\n                <div class=\"star-rating\">\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"far fa-star\"></i>\n                </div>\n\n                <div class=\"text-slider\">\n                    <p class=\"chapter-text\" id=\"text-content\"></p>\n                </div>\n\n                <div class=\"pagination-container\">\n                    <button class=\"arrow-btn prev\" id=\"prev-btn\" onclick=\"prevScreen()\" disabled>\n                        <i class=\"fas fa-arrow-left\"></i>\n                    </button>\n                    <div class=\"page-indicator\" id=\"page-indicator\"></div>\n                    <button class=\"arrow-btn next\" id=\"next-btn\" onclick=\"nextScreen()\">\n                        <i class=\"fas fa-arrow-right\"></i>\n                    </button>\n                </div>\n\n                <div class=\"clues-section\">\n                    <h2>Pistas Encontradas <i class=\"fas fa-search\"></i></h2>\n                    <div class=\"clues-gallery\">\n                        <figure>\n                            <img src=\"fotos/chave.jpg\" alt=\"Chaves\">\n                            <figcaption>Chaves</figcaption>\n                        </figure>\n                        <figure>\n                            <img src=\"fotos/cartas.jpg\" alt=\"Escritura\">\n                            <figcaption>Escritura</figcaption>\n                        </figure>\n                        <figure>\n                            <img src=\"fotos/carta.jpg\" alt=\"Carta\">\n                            <figcaption>Carta</figcaption>\n                        </figure>\n                    </div>\n                </div>\n            </section>\n        </div>\n\n        <button class=\"btn-progredir\" onclick=\"window.location.href=\'capitulo_4.1.html\'\">\n            Progredir Enredo\n        </button>\n    </main>\n\n    <script>\n        const screens = [\n            `A Igrejinha do Céu, no ponto mais alto da cidade, é simples e branca, com uma aura de paz. De lá, a vista de Ipu é completa.`,\n            `Dentro, o sacristão, um homem idoso, cuida do local. Você pergunta sobre a planta original da praça.`,\n            `Ele suspira. 'Muitos segredos esta cidade guarda. A planta que você procura foi considerada... perigosa. Mostrava algo que deveria ficar escondido.'`,\n            `'O arquiteto que a desenhou era um visionário, mas suas ideias entravam em conflito com os interesses dos poderosos da época', ele continua, limpando um candelabro.`,\n            `'Ele escondeu uma cópia na base da Bica do Ipu, o nosso maior tesouro. Ele dizia que a água da bica lavaria as mentiras e revelaria a verdade. Procure pela marca d'água, o mesmo símbolo que tem te guiado.'`\n        ];\n\n        let current = 0;\n        const total = screens.length;\n        const contentEl = document.getElementById('text-content');\n        const indicatorEl = document.getElementById('page-indicator');\n        const prevBtn = document.getElementById('prev-btn');\n        const nextBtn = document.getElementById('next-btn');\n\n        function renderScreen(index) {\n            contentEl.textContent = screens[index];\n            indicatorEl.textContent = \`\${index + 1} / \${total}\`;\n        }\n\n        function nextScreen() {\n            if (current < total - 1) { current += 1; renderScreen(current); }\n            updateButtons();\n        }\n\n        function prevScreen() {\n            if (current > 0) { current -= 1; renderScreen(current); }\n            updateButtons();\n        }\n\n        function updateButtons() {\n            prevBtn.disabled = current === 0;\n            nextBtn.disabled = current === total - 1;\n        }\n\n        renderScreen(current);\n        updateButtons();\n    </script>\n</body>\n</html>\n
