<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo 5 | Revelações (Mãe Natureza)</title>
    <link rel="stylesheet" href="capitulo_5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="auth-manager.js"></script>
</head>
<body>
    <main class="main-container">
        <button class="btn-voltar" onclick="window.location.href='capitulos.html'">
            <i class="fas fa-arrow-left"></i> Voltar
        </button>

        <div class="content-wrapper">
            <header class="chapter-header">
                <img src="fotos/bica.jpg" alt="Bica de Ipu">
                <div class="header-overlay">
                    <h1>Capítulo 5: Revelações<br>(Mãe Natureza)</h1>
                </div>
            </header>

            <section class="chapter-body">
                <div class="star-rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                </div>

                <!-- Slider de texto com navegação Prev/Next -->
                <div class="text-slider">
                    <p class="chapter-text" id="text-content">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque fringilla ac lorem eu tristique.</p>
                </div>

                <div class="pagination-container">
                    <button class="arrow-btn prev" id="prev-btn" onclick="prevScreen()" disabled>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="page-indicator" id="page-indicator">1 / 5</div>
                    <button class="arrow-btn next" id="next-btn" onclick="nextScreen()">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="clues-section">
                    <h2>Pistas Encontradas <i class="fas fa-search"></i></h2>
                    <div class="clues-gallery">
                        <figure>
                            <img src="fotos/chave.jpg" alt="Chaves">
                            <figcaption>Chaves</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/carta.jpg" alt="Escritura">
                            <figcaption>Escritura</figcaption>
                        </figure>
                        <figure>
                            <img src="fotos/cartas.jpg" alt="Carta">
                            <figcaption>Carta</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </div>
         <button class="btn-progredir" onclick="window.location.href='capitulo_5.1.html'" style="margin-top: 20px;">
                Progredir o Enredo
            </button>
    </main>
    <script>
        const screens = [
            'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',
            'Quisque fringilla ac lorem eu tristique. Fusce aliquet aliquet augue a egestas.',
            'Aenean interdum eget mi in commodo. Morbi pellentesque sollicitudin turpis.',
            'Praesent rhoncus mollis dui sed accumsan. Morbi elit urna, pulvinar et sem et.',
            'Viverra iaculis lectus. Morbi at tincidunt lectus. Curabitur augue turpis.'
        ];

        let current = 0;
        const total = screens.length;
        const contentEl = document.getElementById('text-content');
        const indicatorEl = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function renderScreen(index) {
            contentEl.textContent = screens[index];
            indicatorEl.textContent = `${index + 1} / ${total}`;
        }

        function nextScreen() {
            if (current < total - 1) {
                current += 1;
                renderScreen(current);
            }
            updateButtons();
        }

        function prevScreen() {
            if (current > 0) {
                current -= 1;
                renderScreen(current);
            }
            updateButtons();
        }

        function updateButtons() {
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === total - 1;
        }

        renderScreen(current);
        updateButtons();
    </script>
</body>
</html>
