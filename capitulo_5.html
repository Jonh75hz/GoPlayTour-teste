<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Capítulo 5 | Revelações (Mãe Natureza)</title>\n    <!-- Usando o CSS unificado do capítulo 1 -->\n    <link rel=\"stylesheet\" href=\"capitulo_1.css\">\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\">\n    <script type=\"module\" src=\"auth-manager.js\"></script>\n</head>\n<body>\n    <main class=\"main-container\">\n        <button class=\"btn-voltar\" onclick=\"window.location.href=\'capitulos.html\'\">\n            <i class=\"fas fa-arrow-left\"></i> Voltar\n        </button>\n\n        <div class=\"content-wrapper\">\n            <header class=\"chapter-header\">\n                <!-- Imagem específica do Capítulo 5 -->\n                <img src=\"fotos/bica.jpg\" alt=\"Bica de Ipu\">\n                <div class=\"header-overlay\">\n                    <h1>Capítulo 5: Revelações<br>(Mãe Natureza)</h1>\n                </div>\n            </header>\n\n            <section class=\"chapter-body\">\n                <div class=\"star-rating\">\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                    <i class=\"fas fa-star\"></i>\n                </div>\n\n                <div class=\"text-slider\">\n                    <p class=\"chapter-text\" id=\"text-content\"></p>\n                </div>\n\n                <div class=\"pagination-container\">\n                    <button class=\"arrow-btn prev\" id=\"prev-btn\" onclick=\"prevScreen()\" disabled>\n                        <i class=\"fas fa-arrow-left\"></i>\n                    </button>\n                    <div class=\"page-indicator\" id=\"page-indicator\"></div>\n                    <button class=\"arrow-btn next\" id=\"next-btn\" onclick=\"nextScreen()\">\n                        <i class=\"fas fa-arrow-right\"></i>\n                    </button>\n                </div>\n\n                <div class=\"clues-section\">\n                    <h2>Pistas Encontradas <i class=\"fas fa-search\"></i></h2>\n                    <div class=\"clues-gallery\">\n                        <figure>\n                            <img src=\"fotos/chave.jpg\" alt=\"Chaves\">\n                            <figcaption>Chaves</figcaption>\n                        </figure>\n                        <figure>\n                            <img src=\"fotos/cartas.jpg\" alt=\"Escritura\">\n                            <figcaption>Escritura</figcaption>\n                        </figure>\n                        <figure>\n                            <img src=\"fotos/carta.jpg\" alt=\"Carta\">\n                            <figcaption>Carta</figcaption>\n                        </figure>\n                    </div>\n                </div>\n            </section>\n        </div>\n         <button class=\"btn-progredir\" onclick=\"window.location.href=\'capitulo_5.1.html\'\">\n                Progredir o Enredo\n            </button>\n    </main>\n    <script>\n        const screens = [\n            `A Bica do Ipu é um espetáculo. A água despenca com força, criando uma névoa que molha as pedras ao redor. O som da cachoeira abafa os ruídos da cidade.`,\n            `Seguindo a indicação, você encontra uma pedra solta perto da base da queda d'água. Atrás dela, um compartimento à prova d'água guarda um cilindro de metal.`,\n            `Dentro do cilindro, a planta original da Praça Iracema. Ela revela um complexo sistema de túneis subterrâneos, conectando a praça, a estação e a casa de cultura.`,\n            `Um dos túneis leva a uma câmara secreta sob o local onde a estátua original ficava. A planta detalha como a estátua não foi demolida, mas sim recolhida para dentro desta câmara através de um engenhoso mecanismo.`,\n            `A verdade, finalmente, se revela: a estátua original de Iracema, feita de um material valioso e considerada uma obra-prima, foi escondida para protegê-la de um confisco durante um período de instabilidade política. O desaparecimento foi uma farsa para preservar a arte. O mistério está resolvido.`\n        ];\n\n        let current = 0;\n        const total = screens.length;\n        const contentEl = document.getElementById('text-content');\n        const indicatorEl = document.getElementById('page-indicator');\n        const prevBtn = document.getElementById('prev-btn');\n        const nextBtn = document.getElementById('next-btn');\n\n        function renderScreen(index) {\n            contentEl.textContent = screens[index];\n            indicatorEl.textContent = \`\${index + 1} / \${total}\`;\n        }\n\n        function nextScreen() {\n            if (current < total - 1) { current += 1; renderScreen(current); }\n            updateButtons();\n        }\n\n        function prevScreen() {\n            if (current > 0) { current -= 1; renderScreen(current); }\n            updateButtons();\n        }\n\n        function updateButtons() {\n            prevBtn.disabled = current === 0;\n            nextBtn.disabled = current === total - 1;\n        }\n\n        renderScreen(current);\n        updateButtons();\n    </script>\n</body>\n</html>
